name: Test fail_on_test_failures with failing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture failing reports into target surefire-reports path
        run: |
          mkdir -p target/surefire-reports
          cp tests/fixtures/surefire-reports/TEST-failing.xml target/surefire-reports/TEST-failing.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          report_paths: 'target/surefire-reports/TEST-*.xml'
          skip_publishing: 'true'
          fail_if_no_tests: 'true'
          fail_on_test_failures: 'true'

      - name: Assert action failed due to test failures
        env:
          STEP_OUTCOME: ${{ steps.action.outcome }}
          TEST_CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "step outcome: $STEP_OUTCOME"
          echo "test conclusion: $TEST_CONCLUSION"
          if [ "$STEP_OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail due to test failures, but got '$STEP_OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when test failures detected"
