name: Test fail_if_no_tests when no reports found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          report_paths: 'target/nonexistent-reports/TEST-*.xml'
          skip_publishing: 'true'
          fail_if_no_tests: 'true'
          fail_on_test_failures: 'false'

      - name: Assert conclusion is failure when no tests found
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion 'failure' when no test reports found, but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action correctly reported failure conclusion when no test reports found"
