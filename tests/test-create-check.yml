name: Test create_check with passing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture reports into target surefire-reports path
        run: |
          mkdir -p target/surefire-reports
          cp tests/fixtures/surefire-reports/TEST-passing.xml target/surefire-reports/TEST-passing.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          report_paths: 'target/surefire-reports/TEST-*.xml'
          create_check: 'true'
          check_name: 'Test Report'
          skip_publishing: 'false'
          fail_if_no_tests: 'true'
          fail_on_test_failures: 'false'

      - name: Assert action ran (check creation may fail on sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.conclusion }}
          STEP_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $STEP_OUTCOME"
          echo "action conclusion output: $RESULT"
          if [ "$STEP_OUTCOME" = "success" ]; then
            if [ "$RESULT" != "success" ]; then
              echo "FAIL: action succeeded but conclusion output is not 'success', got '$RESULT'"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion '$RESULT'"
          elif [ "$STEP_OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for check creation)"
          else
            echo "FAIL: unexpected step outcome '$STEP_OUTCOME'"
            exit 1
          fi
